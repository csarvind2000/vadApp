server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded videos can be large.
    client_max_body_size 2G;

    # Content-hashed build assets never change under a given name, so they can be
    # cached indefinitely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths fall through to index.html so React Router
    # can handle them on a hard refresh.
    #
    # index.html must never be cached. It carries the reference to the hashed
    # bundle, so a cached copy pins the browser to a previous deployment and new
    # features appear to be missing even though the server is serving them.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        # $http_host preserves the port; $host strips it, which makes Django's
        # build_absolute_uri() emit http://localhost/... and every media URL
        # unreachable from the browser.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Media is served straight from the shared volume, not proxied to Django.
    # django.conf.urls.static.static() returns no patterns when DEBUG is False,
    # so a production start has no /media/ route at all. Serving here also gives
    # byte-range support, which HTML5 video seeking requires.
    location /media/ {
        alias /usr/share/nginx/media/;
        add_header Accept-Ranges bytes;
        types {
            video/mp4    mp4;
            video/webm   webm;
            video/x-msvideo avi;
            video/quicktime mov;
            image/jpeg   jpg jpeg;
            image/png    png;
        }
        default_type application/octet-stream;
        access_log off;
        expires 1h;
    }
}
